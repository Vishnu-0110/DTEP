services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      UPLOAD_DIR: /app/uploads
    ports:
      - "5000:5000"
    volumes:
      - uploads-data:/app/uploads

  frontend:
    build:
      context: .
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  uploads-data:
